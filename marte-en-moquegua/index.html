<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marte en Moquegua · 404 Sleep Not Found</title>
<meta name="description" content="Mars analog finder for southern Peru using NASA data and published criteria. NASA Space Apps Challenge 2026 · Team 404 Sleep Not Found.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
<div id="globe" aria-label="Globo 3D / 3D globe"></div>
<div id="haze"></div>

<header id="topbar" class="glass">
  <button type="button" class="brand" aria-label="Inicio / Home"><span class="logo"><span></span></span><span class="bt"><b>MARTE EN MOQUEGUA</b><small>Buscador de análogos de Marte · Datos NASA</small></span></button>
  <nav id="modes" aria-label="Modo / Mode"></nav>
  <div class="actions">
    <button type="button" id="btnHome" class="btn ghost"></button>
    <div class="langctl" id="langctl" role="group" aria-label="Idioma / Language"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button></div>
    <div class="fzctl" role="group"><button type="button" id="fzDown">A−</button><button type="button" id="fzUp">A+</button></div>
    <button type="button" id="btnMethod" class="btn ghost"></button>
    <button type="button" id="btnTour" class="btn ghost"></button>
    <button type="button" id="btnClean" class="btn ghost"></button>
  </div>
</header>

<aside id="left" class="glass panel ui">
  <div class="phead"><div id="leftHead"></div><button type="button" class="icbtn" id="leftToggle"></button></div>
  <div class="rail" id="rail"></div>
  <div class="lc" id="leftBody"></div>
</aside>

<div id="hud" class="glass mono ui"></div>

<div id="mapbox" class="glass ui">
  <div class="phead"><span class="ttl" id="mapTitle"></span><button type="button" class="icbtn" id="mapToggle" aria-label="Plegar / Collapse"></button></div>
  <div class="mbody"><div id="mapbody"></div><canvas id="minimap" class="hidden" width="224" height="190"></canvas></div>
</div>

<aside id="ficha" class="glass panel hidden ui" aria-live="polite"></aside>
<section id="sim" class="glass hidden" aria-live="polite"></section>
<div id="tip" class="tip glass hidden" role="tooltip"></div>

<div id="aresOrb" class="ui" role="button" tabindex="0" aria-label="FOBOS"><div class="core"><i></i><i></i><i></i></div><span class="lbl">FOBOS</span></div>
<section id="ares" class="glass hidden" aria-label="FOBOS">
  <header id="aresHead">
    <div class="ares-id"><span id="aresGrip"></span><b>FOBOS</b><small id="aresMode"></small></div>
    <div class="hbtns"><button type="button" id="aresGear" class="icbtn" aria-label="IA / AI"></button><button type="button" id="aresClose" class="icbtn" aria-label="Minimizar / Minimize"></button></div>
  </header>
  <div id="aresLog" aria-live="polite"></div>
  <div id="aresChips"></div>
  <form id="aresForm"><input id="aresIn" autocomplete="off" aria-label="FOBOS"><button type="submit" class="icbtn" id="aresSend" aria-label="Enviar / Send"></button></form>
</section>

<div id="caption" class="glass hidden" role="status"></div>
<div id="modal" class="hidden"><div class="modal-box glass" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div id="method" class="hidden" role="dialog" aria-modal="true"></div>

<div id="intro">
  <div class="intro-grid">
    <div class="intro-text">
      <div class="kicker" id="introKicker"></div>
      <h1 id="introH1"></h1>
      <p id="introP"></p>
      <ul class="steps3" id="introSteps"></ul>
      <div class="intro-stats" id="introStats"></div>
      <div class="intro-btns"><button type="button" id="btnExplore" class="btn primary"></button><button type="button" id="btnGameIntro" class="btn"></button><button type="button" id="btnIntroTour" class="btn ghost"></button></div>
      <div class="intro-foot" id="introFoot"></div>
    </div>
    <div class="intro-mars"><model-viewer src="models/mars.glb" alt="Mars" auto-rotate rotation-per-second="12deg" camera-controls disable-zoom interaction-prompt="none" exposure="1.1" shadow-intensity="0"></model-viewer></div>
  </div>
  <div id="loading" class="mono"></div>
</div>

<script src="js/charts.js"></script>
<script src="js/fobos.js"></script>
<script src="js/report.js"></script>
<script src="js/extras.js"></script>
<script src="js/app.js"></script>
</body>
</html>
